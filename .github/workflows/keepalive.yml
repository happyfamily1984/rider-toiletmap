name: Keep server awake

# Render 무료 서버는 15분 동안 접속이 없으면 잠들어서, 처음 열 때 30초~1분 걸린다.
# 한국 시간 오전 6시 ~ 새벽 2시(하루 20시간)만 5분마다 깨워 둔다.
#  - Render 무료 한도(계정 전체 월 750시간) 안에서 약 620시간만 사용 → 예전 앱 서버 몫도 남김
#  - /api/config 는 DB 를 쓰지 않으므로 Neon(DB) 무료 사용 시간은 거의 쓰지 않음
on:
  schedule:
    # cron 은 UTC 기준: 한국 06:00~02:00 = UTC 21:00~17:00
    - cron: '*/5 0-16,21-23 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          url="${WEB_URL:-https://rider-toiletmap.onrender.com/}"
          curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 90 --retry 2 "${url%/}/api/config" || true
