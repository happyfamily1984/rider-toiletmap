<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f9d6b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="라이더 화장실맵" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="배달 라이더를 위한 전국 화장실 지도. 위치와 비밀번호를 누구나 등록하고 공유해요" />
  <!-- 메신저(카카오톡·텔레그램 등) 링크 미리보기 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="라이더 화장실맵" />
  <meta property="og:title" content="라이더 화장실맵" />
  <meta property="og:description" content="배달 라이더를 위한 전국 화장실 지도. 위치와 비밀번호를 누구나 등록하고 공유해요" />
  <meta property="og:image" content="/icons/icon-512.png" />
  <title>라이더 화장실맵</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 지도 화면 -->
  <section id="main" class="main" hidden>
    <div id="map" class="map"></div>

    <header class="topbar">
      <button id="near-btn" class="near-btn" type="button" aria-label="내 근처 화장실"><svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M20.5 3.5 3.8 10.4c-.9.4-.8 1.7.1 1.9l6.6 1.6 1.6 6.6c.2.9 1.5 1 1.9.1z"/></svg>내 근처</button>
      <button id="search-btn" class="icon-btn" type="button" aria-label="지역 검색">
        <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      </button>
      <button id="rank-btn" class="icon-btn rank-btn" type="button" aria-label="순위표">
        <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M7 3h10v2h3.5v2.5A4.5 4.5 0 0 1 16.6 12 5.5 5.5 0 0 1 13 14.8V17h3v2H8v-2h3v-2.2A5.5 5.5 0 0 1 7.4 12 4.5 4.5 0 0 1 3.5 7.5V5H7zm0 4H5.5v.5A2.5 2.5 0 0 0 7.2 9.9 6 6 0 0 1 7 8.6zm10 0v1.6a6 6 0 0 1-.2 1.3 2.5 2.5 0 0 0 1.7-2.4V7zM6 20h12v1.5H6z"/></svg>
      </button>
      <button id="menu-btn" class="icon-btn" type="button" aria-label="메뉴">
        <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
      </button>
      <div id="menu" class="menu" hidden>
        <div class="menu-head">
          <span class="menu-logo"><svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="7" cy="4.6" r="2.1"/><path d="M5 8.2h4a1.2 1.2 0 0 1 1.2 1.2V15H8.7v6H5.3v-6H3.8V9.4A1.2 1.2 0 0 1 5 8.2z"/><rect x="11.4" y="3" width="1.2" height="18" rx=".6"/><circle cx="17" cy="4.6" r="2.1"/><path d="M15.1 8.2h3.8l2.4 7.3h-2.3V21h-1.7v-4.6h-.6V21H15v-5.5h-2.3z"/></svg></span>
          <span class="menu-title">라이더 화장실맵</span>
          <button type="button" id="menu-close" class="menu-close" aria-label="메뉴 닫기">
            <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <button type="button" id="me-btn" class="menu-item me-item">
          <svg class="ico green" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg>
          <span id="me-label">구글로 로그인</span><svg class="chev" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button type="button" id="rank-menu-btn" class="menu-item">
          <svg class="ico green" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M7 3h10v2h3.5v2.5A4.5 4.5 0 0 1 16.6 12 5.5 5.5 0 0 1 13 14.8V17h3v2H8v-2h3v-2.2A5.5 5.5 0 0 1 7.4 12 4.5 4.5 0 0 1 3.5 7.5V5H7z"/></svg>
          <span>순위표</span><svg class="chev" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <a class="menu-item" href="/terms.html" target="_blank" rel="noopener">
          <svg class="ico green" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M9.5 12.5h7M9.5 16h7"/></svg>
          <span>이용 규칙</span><svg class="chev" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <a class="menu-item" href="/privacy.html" target="_blank" rel="noopener">
          <svg class="ico green" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4-6.3 6.3z"/></svg>
          <span>개인정보처리방침</span><svg class="chev" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <button type="button" id="admin-btn" class="menu-item">
          <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg>
          <span>운영자</span><svg class="chev" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div class="menu-credit">
          <svg class="ico green" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
          <span>공중화장실 정보: 공공데이터포털 전국공중화장실표준데이터(공공누리 제1유형)<br>걷는 길 경로: © OpenStreetMap contributors, FOSSGIS 경로 서비스</span>
        </div>
      </div>
    </header>

    <div id="hint" class="hint">지도를 확대하면 화장실 이름과 비밀번호가 보여요</div>

    <!-- 내 위치: 왼쪽 맨 아래 -->
    <button id="locate-btn" class="fab locate-btn" type="button" aria-label="내 위치">
      <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
    </button>

    <div class="fabs">
      <button id="add-btn" class="add-btn" type="button"></button>
    </div>

    <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
    <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div id="sheet-body"></div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </section>

  <div id="fatal" class="fatal" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
